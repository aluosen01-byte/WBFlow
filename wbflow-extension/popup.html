<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WBFlow 设置</title>
  <style>
    body { width: 300px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #1c1c2e; margin: 0; }
    .wrap { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(90deg, #7b2bf9, #cb11ab); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
    .sub { color: #8a8aa3; font-size: 11.5px; margin-bottom: 12px; }
    label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-weight: 600; color: #44445c; }
    input, select { padding: 7px 9px; border: 1px solid #e6e6f0; border-radius: 7px; font-size: 12.5px; font-family: inherit; }
    .row2 { display: flex; gap: 8px; }
    .row2 label { flex: 1; }
    .btn { padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12.5px; font-family: inherit; }
    .btn.primary { background: linear-gradient(90deg, #7b2bf9, #cb11ab); color: #fff; width: 100%; }
    .btn.primary:disabled { opacity: .5; }
    .btn.ghost { background: #f1f1f8; color: #44445c; margin-top: 8px; width: 100%; }
    #status { margin-top: 10px; font-size: 12px; color: #8a8aa3; min-height: 16px; }
    #status.ok { color: #1d8127; }
    #status.err { color: #d41f1c; }
    .hint { font-weight: 400; color: #8a8aa3; font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="logo">WB</span> WBFlow 一键搬品</h1>
    <div class="sub">在 WB 商品页注入「一键搬品」按钮</div>

    <label>后端服务地址
      <input id="backendUrl" type="text" placeholder="http://localhost:3000" />
      <span class="hint">打开本设置或商品页时后端将自动启动（需先运行一次 native-host\install-host.bat）</span>
    </label>
    <label>仓库
      <select id="warehouseId"><option value="">（自动检测）</option></select>
    </label>
    <div class="row2">
      <label>价格策略
        <select id="priceMode">
          <option value="manual">手动填写</option>
          <option value="source">使用源商品价格</option>
          <option value="multiplier">源价格 × 倍率</option>
        </select>
      </label>
      <label>倍率
        <input id="priceMultiplier" type="number" step="0.1" min="0.1" value="1.5" />
      </label>
    </div>
    <div class="row2">
      <label>默认库存
        <input id="stock" type="number" min="0" value="10" />
      </label>
      <label>默认品牌
        <input id="defaultBrand" type="text" placeholder="留空用源品牌" />
      </label>
    </div>

    <button id="btnSave" class="btn primary">保存设置</button>
    <button id="btnTest" class="btn ghost">测试连接后端</button>
    <button id="btnOpen" class="btn ghost">打开 WBFlow 完整界面</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
